[params]
# 基本参数
description = "启煊软件提供问渠 DataOps-AI 教育数据智能闭环、HodoopForge 数据湖、HadoopForge 大数据运维、鸿源边缘AI推理加速器、悦学智伴AI教育、智慧能源EMS与中小企业ERP解决方案，坚持自主研发、全栈可控、国产替代。"
author = "深圳市启煊软件有限公司"

# SEO优化
keywords = "问渠DataOps-AI,HodoopForge数据湖,教育数据智能,DataOps,教育大数据,湖仓一体,实时入湖,Kerberos,HadoopForge,Hadoop集群管理,信创大数据,国产替代,边缘AI,FPGA加速器,AI伴学,悦学智伴,智慧能源EMS,光储充,VPP虚拟电厂,中小企业ERP,启煊软件"
robots = "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"

# SEO / 搜索引擎接入
[params.seo]
  brandName = "启煊软件"
  brandNameEn = "Qixuan Software"
  defaultImage = "images/hadoopforge-platform.jpg"
  # 百度搜索资源平台「自动推送」：true 开启（仅生产环境生效）
  baiduPush = true
  # 以下验证码在对应站长平台获取后填入；留空不输出
  baiduVerification = "codeva-X3Y1LduE7E"
  googleVerification = "wkv_HWJU9aYpwes2MjBYcEFxsQNvHRtgQbpiMssVB1A"
  bingVerification = ""
  sogouVerification = ""
  qihooVerification = ""
  bytedanceVerification = ""

# 分析工具（填入 ID 后自动启用）
googleAnalytics = ""
baiduAnalytics = ""

# Open Graph / 社交媒体分享
[params.og]
  siteName = "深圳市启煊软件有限公司"
  locale = "zh_CN"
  type = "website"
  image = "images/hadoopforge-platform.jpg"

# 社交媒体
[params.social]
  email = "axel@qixuan.vip"
  phone = "18923719468"
  address = "深圳市龙岗区龙城街道龙平西路28号"
  wechat = "深圳市启煊软件有限公司"

# 公司信息
[params.company]
  name = "深圳市启煊软件有限公司"
  legalName = "深圳市启煊软件有限公司"
  foundingDate = "2020"
  logo = "images/logo.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.extensions]
      linkify = true
      strikethrough = true
      table = true
      taskList = true
  [markup.highlight]
    style = "github-dark"
    noClasses = true

# URL处理配置
canonifyURLs = true
relativeURLs = false

# 忽略警告
ignoreLogs = ['warning-partial-superfluous-prefix']

# 性能优化
[minify]
  disableHTML = true
  disableCSS = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

# 缓存配置
[caches]
  [caches.getjson]
    dir = ":cacheDir/:project"
    maxAge = "10m"
  [caches.getcsv]
    dir = ":cacheDir/:project"
    maxAge = "10m"
  [caches.images]
    dir = ":resourceDir/_gen"
    maxAge = "720h"
  [caches.assets]
    dir = ":resourceDir/_gen"
    maxAge = "720h"

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'