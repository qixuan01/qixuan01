<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if eq .Site.Language.Lang "zh" }}问渠 DataOps-AI · 解决方案交互地图{{ else }}Wenqu DataOps-AI · Interactive Solution Map{{ end }} - {{ .Site.Title }}</title>
<meta name="description" content="{{ .Description }}">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#08111f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .topnav{
    position:fixed;top:0;left:0;right:0;z-index:999;
    display:flex;align-items:center;gap:12px;
    padding:0 18px;height:44px;
    background:rgba(8,17,31,0.96);
    border-bottom:1px solid rgba(34,211,238,0.18);
    backdrop-filter:blur(12px);
  }
  .topnav a{text-decoration:none;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    color:rgba(255,255,255,0.65);font-size:12.5px;
    padding:4px 10px;border-radius:6px;
    border:1px solid rgba(255,255,255,0.12);
    transition:all 0.18s;
  }
  .back-btn:hover{color:#fff;border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.07);}
  .nav-logo{
    display:flex;align-items:center;gap:8px;
    color:rgba(255,255,255,0.9);font-size:13.5px;font-weight:650;
  }
  .nav-logo img{height:22px;border-radius:4px;}
  .nav-title{
    margin-left:auto;
    color:#22d3ee;font-size:12.5px;font-weight:650;letter-spacing:0.04em;
  }
  .map-frame{
    position:fixed;top:44px;left:0;right:0;bottom:0;
    border:none;width:100%;height:calc(100% - 44px);
    display:block;
  }
</style>
</head>
<body>
<nav class="topnav">
  <a class="back-btn" href="{{ if eq .Site.Language.Lang "zh" }}{{ printf "%sproducts/" .Site.BaseURL }}{{ else }}{{ printf "%sen/products/" .Site.BaseURL }}{{ end }}">
    ← {{ if eq .Site.Language.Lang "zh" }}产品{{ else }}Products{{ end }}
  </a>
  <a class="nav-logo" href="{{ if eq .Site.Language.Lang "zh" }}{{ .Site.BaseURL }}{{ else }}{{ printf "%sen/" .Site.BaseURL }}{{ end }}">
    <img src="{{ printf "%simages/logo.png" .Site.BaseURL }}" alt="logo">
    {{ if eq .Site.Language.Lang "zh" }}启煊软件{{ else }}Qixuan{{ end }}
  </a>
  <span class="nav-title">{{ if eq .Site.Language.Lang "zh" }}问渠 DataOps-AI · 解决方案交互地图{{ else }}Wenqu DataOps-AI · Solution Map{{ end }}</span>
</nav>
<iframe
  class="map-frame"
  src="{{ printf "%smaps/wenqu-interactive-map.html" .Site.BaseURL }}"
  title="{{ if eq .Site.Language.Lang "zh" }}问渠解决方案交互地图{{ else }}Wenqu Solution Interactive Map{{ end }}"
  allowfullscreen>
</iframe>
</body>
</html>
