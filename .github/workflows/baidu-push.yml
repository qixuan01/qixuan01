name: Baidu URL Push

on:
  schedule:
    # 09:30 Asia/Shanghai (01:30 UTC) every day
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baidu-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Push priority URLs to Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          BAIDU_SITE: https://www.qixuan.vip
        run: |
          python3 scripts/baidu_push.py \
            --file scripts/baidu_priority_urls.txt \
            --max 6
